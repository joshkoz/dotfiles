# Testcontainers config for rootless Podman. Read by Testcontainers for .NET, Java and Go,
# whether tests run from a shell or from an IDE launched by the desktop.
# Properties can't expand $(id -u), so the uid is hardcoded.
docker.host=unix:///run/user/1000/podman/podman.sock

# Ryuk (the resource reaper) removes containers, volumes and networks once the test process
# disconnects, even if it crashed or was stopped from the IDE. It bind-mounts the socket below.
docker.socket.override=/run/user/1000/podman/podman.sock
ryuk.container.privileged=true

# Published ports are reachable on localhost.
host.override=127.0.0.1
