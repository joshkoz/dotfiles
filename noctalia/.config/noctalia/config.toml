# Noctalia v5 config. Replaces waybar + dunst + wofi (as the launcher).
# Docs: https://docs.noctalia.dev/noctalia/configuration/
# Settings changed in the GUI are saved to ~/.local/state/noctalia/settings.toml and win over this file.

[theme]
source = "custom"
custom_palette = "Kanagawabones"   # palettes/Kanagawabones.json: Ghostty's Kanagawabones colours
builtin = "Kanagawa"               # used if source is switched back to "builtin"
# pick themes with SUPER+SHIFT+T (opens Noctalia's theme settings)
mode = "dark"

    # Apps that follow Noctalia's palette:
    # - hyprland: window borders (writes hypr/noctalia.lua)
    # - gtk3/gtk4: writes gtk-{3,4}.0/noctalia.css, imports it from gtk.css, and selects
    #   the adw-gtk3(-dark) theme (needs the adw-gtk-theme package)
    # - ghostty: writes ghostty/themes/noctalia and sets `theme = noctalia` in the ghostty config
    [theme.templates]
    enable_builtin_templates = true
    builtin_ids = [ "hyprland", "gtk3", "gtk4", "ghostty" ]
    enable_community_templates = false

[shell]
launch_apps_as_systemd_services = true   # apps launched from Noctalia survive a Noctalia restart
clipboard_enabled = false                # cliphist-text/images services already keep clipboard history
polkit_agent = true                      # admin password prompts (replaces hyprpolkitagent)

    # Session menu: the default five actions, but Log out goes through stop-hyprland-session
    # (stops hyprland-session.target before exiting Hyprland, like the old wlogout button).
    # systemd-run puts it in its own unit: the script stops noctalia.service, which would
    # otherwise kill the script halfway through.
    [[shell.session.actions]]
    action = "lock"

    [[shell.session.actions]]
    action = "logout"
    command = "systemd-run --user --collect --quiet /home/joshua/.bin/stop-hyprland-session --force"

    [[shell.session.actions]]
    action = "lock_and_suspend"

    [[shell.session.actions]]
    action = "reboot"

    [[shell.session.actions]]
    action = "shutdown"
    variant = "destructive"

    [shell.animation]
    speed = 3.0                          # multiplier: 1.0 = default, higher = snappier panels/launcher

# Wallpapers: one 7680x2160 image spans both 4K monitors (DP-1 left, DP-2 right).
# Pick with SUPER+SHIFT+W, the bar's wallpaper button, or "/wall" in the launcher.
[wallpaper]
enabled = true
fill_mode = "span"
directory = "/home/joshua/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/joshua/Pictures/wallpapers/forest-wide.jpg"

# hyprlock can't span, so this keeps ~/.current-wallpaper-{left,right} as the two halves
[hooks]
started = "~/.config/noctalia/hooks/lock-wallpaper.sh"
wallpaper_changed = "~/.config/noctalia/hooks/lock-wallpaper.sh"
session_locked = "pidof 1password >/dev/null && 1password --lock || true"

# ---------------------------------------------------------------------------
# Bar: laid out like the old waybar. Full width along the bottom, flat edges,
# workspaces left, now playing in the middle, tray/volume/clock on the right.
# ---------------------------------------------------------------------------
[bar]
order = [ "default" ]

    [bar.default]
    position = "bottom"
    margin_ends = 0              # span the whole screen (default 100 makes it a floating island)
    margin_edge = 0
    radius = 0                   # square ends, like waybar
    concave_edge_corners = false
    thickness = 30
    padding = 12
    widget_spacing = 12

    # Same left/middle/right split as waybar, plus most of Noctalia's default widgets.
    # Left out: clipboard (cliphist keeps that job), brightness (no backlight on this
    # desktop) and battery (no system battery).
    start = [ "launcher", "wallpaper", "workspaces" ]
    center = [ "media" ]
    end = [
        "tray",
        "notifications",
        "network",
        "bluetooth",
        "volume",
        "clock",
        "control-center",
        "session"
    ]

# Lock screen + idle (replaces hyprlock/hypridle). Also locks on `loginctl lock-session`
# and before suspend (lock_before_suspend, on by default).
[lockscreen]
transition = [ "fade" ]          # lock/unlock animation; [] = instant
transition_duration = 600        # milliseconds (default 1500)
blur_intensity = 0.8             # wallpaper blur behind the lock UI (default 0.5)

[idle.behavior.lock]
action = "lock"
timeout = 300                    # 5 minutes, same as the old hypridle setup
enabled = true

# Screen-off stays disabled: DPMS off crashes Hyprland intermittently on NVIDIA (dies in the
# DRM connector probe aquamarine runs after outputs are disabled; started Nov 2026, possibly
# kernel 7.2.14). Re-enable once fixed upstream.
[idle.behavior.screen-off]
enabled = false

# Volume/brightness/etc. popups: bottom middle, just above the bar
[osd]
position = "bottom_center"

# ---------------------------------------------------------------------------
# Notifications (replaces dunst; dunst was top-right too)
# ---------------------------------------------------------------------------
[notification]
position = "top_right"
